# e2_silos -- silo-count / Dirichlet-skew sweep (E2)
# Config schema: INTERFACES.md section 10
exp: e2_silos
mode: full
dataset: ds1
silos_grid: [5, 10]
dirichlet_alpha_grid: [0.1, 0.5, 1.0]
revocation_ratios: [0.05]
shadow_ratios: [0.10]
encoder: BAAI/bge-small-en-v1.5
generator: Qwen/Qwen2.5-1.5B-Instruct
generator_4bit: true
k: 10
n_queries_eval: 300
method: fedrevoke
baselines: [naive_delete, full_rebuild]
shadow: {sim_threshold: 0.92, lsh_threshold: 0.80, knn_k: 50, cross_client_only: true}
repair: {n_anchors: 64, recalibrate: true}
seed: 20260214
out_dir: artifacts/results/e2_silos
